# Prometheus Configuration for Local Development
# Usa este archivo cuando los microservicios corren localmente (sin Docker)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway (corriendo en localhost:8000)
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics

  # Auth Service (corriendo en localhost:3001)
  - job_name: 'auth-service'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: /metrics

  # Denuncias Service (corriendo en localhost:3002)
  - job_name: 'denuncias-service'
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: /metrics

  # Logs Service (corriendo en localhost:3003)
  - job_name: 'logs-service'
    static_configs:
      - targets: ['host.docker.internal:3003']
    metrics_path: /metrics
