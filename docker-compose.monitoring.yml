# Docker Compose - Solo Monitoreo (Prometheus + Grafana)
# Usar cuando los microservicios corren localmente
# Comando: docker-compose -f docker-compose.monitoring.yml up -d

version: '3.8'

networks:
  monitoring-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  # ===========================================
  # PROMETHEUS - Recolector de métricas
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: voz-segura-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ===========================================
  # GRAFANA - Visualización de métricas
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: voz-segura-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-network
    restart: unless-stopped
