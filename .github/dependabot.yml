version: 2

updates:
  # ================================
  # DEPENDENCIAS - AUTH SERVICE
  # ================================
  - package-ecosystem: "npm"
    directory: "/microservices/auth-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Sebasky26"
    labels:
      - "dependencies"
      - "auth-service"
    commit-message:
      prefix: "chore(auth)"
      include: "scope"
    versioning-strategy: increase

  # ================================
  # DEPENDENCIAS - DENUNCIAS SERVICE
  # ================================
  - package-ecosystem: "npm"
    directory: "/microservices/denuncias-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Sebasky26"
    labels:
      - "dependencies"
      - "denuncias-service"
    commit-message:
      prefix: "chore(denuncias)"
      include: "scope"
    versioning-strategy: increase

  # ================================
  # DEPENDENCIAS - LOGS SERVICE
  # ================================
  - package-ecosystem: "npm"
    directory: "/microservices/logs-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Sebasky26"
