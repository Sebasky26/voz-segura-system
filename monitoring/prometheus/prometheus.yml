global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: 'denuncias-service'
    static_configs:
      - targets: ['denuncias-service:3002']

  - job_name: 'logs-service'
    static_configs:
      - targets: ['logs-service:3003']
