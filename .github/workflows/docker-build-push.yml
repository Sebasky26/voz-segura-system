          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-load-balancer:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-load-balancer:buildcache,mode=max

  # ================================
  # RESUMEN DE BUILD
  # ================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: 
      - build-auth-service
      - build-denuncias-service
      - build-logs-service
      - build-api-gateway
      - build-frontend
      - build-load-balancer
    if: always()
    
    steps:
      - name: Build Summary
        run: |
          echo "🐳 Docker Build Pipeline Summary"
          echo "================================"
          echo "Auth Service: ${{ needs.build-auth-service.result }}"
          echo "Denuncias Service: ${{ needs.build-denuncias-service.result }}"
          echo "Logs Service: ${{ needs.build-logs-service.result }}"
          echo "API Gateway: ${{ needs.build-api-gateway.result }}"
          echo "Frontend: ${{ needs.build-frontend.result }}"
          echo "Load Balancer: ${{ needs.build-load-balancer.result }}"
          echo ""
          echo "📦 Images available at: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-*"
